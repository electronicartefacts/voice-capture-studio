name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build immutable release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          artifact="voice-capture-studio-${GITHUB_SHA}.tar.gz"
          tar -C dist -czf "${RUNNER_TEMP}/${artifact}" .
          npm sbom --sbom-format cyclonedx > "${RUNNER_TEMP}/voice-capture-studio-${GITHUB_SHA}.cdx.json"
          cd "${RUNNER_TEMP}"
          sha256sum "${artifact}" > "${artifact}.sha256"
          sha256sum --check "${artifact}.sha256"

      - name: Attest release archive provenance
        id: attest-provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.tar.gz

      - name: Attest release archive SBOM
        id: attest-sbom
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.tar.gz
          sbom-path: ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.cdx.json

      - name: Upload immutable release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/voice-capture-studio-${{ github.sha }}.cdx.json
            ${{ steps.attest-provenance.outputs.bundle-path }}
            ${{ steps.attest-sbom.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
